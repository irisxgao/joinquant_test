<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粵語就這麼簡單 · 粵拼注音版</title>
<style>
:root{
  --accent:#b44a2d; --accent-strong:#8f361d; --panel:#fffdf9; --panel-alt:#f2e7d9;
  --sidebar-bg:#284254; --sidebar-text:#f7f3ec; --border:#decdb9; --text:#2d241d;
  --muted:#7a6a5b; --pinyin:#b06a3b; --highlight:#fff1c9; --speaking:#ffe08a;
  --weak:#d94f3d; --en:#2f6b56;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{display:flex;min-height:100vh;background:linear-gradient(135deg,#f8f3ea 0%,#efe4d5 100%);
  color:var(--text);font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}
#sidebar{width:236px;min-width:236px;display:flex;flex-direction:column;gap:10px;padding:16px 12px;
  background:var(--sidebar-bg);color:var(--sidebar-text);overflow-y:auto}
#sidebar h1{margin:0;font-size:15px;line-height:1.5;text-align:center;color:#ffd79b;
  padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.14)}
.nav-part{margin:10px 0 4px;font-size:12px;color:#ffd79b;letter-spacing:.05em}
.nav-btn{width:100%;border:none;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.08);
  color:var(--sidebar-text);font-size:13px;text-align:left;cursor:pointer;margin-bottom:5px}
.nav-btn:hover,.nav-btn.active{background:var(--accent);color:#fff}
#controls{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.14)}
#controls label{display:block;margin-bottom:6px;font-size:12px;color:#e8dfd2}
#speed-slider{width:100%;accent-color:#f0a55e}
#stop-btn{width:100%;margin-top:10px;padding:8px 10px;border:none;border-radius:10px;
  background:rgba(255,255,255,.16);color:#fff;cursor:pointer}
#main{flex:1;overflow-y:auto;padding:22px 24px 60px}
#readbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-bottom:18px;padding:10px 12px;background:rgba(255,250,243,.94);backdrop-filter:blur(8px);
  border:1px solid var(--border);border-radius:14px}
#readbar button{border:none;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px;
  background:var(--accent);color:#fff}
#readbar button.off{background:#9c9186}
#status{font-size:12px;color:var(--muted)}
.chapter{display:none}
.chapter.active{display:block}
.chapter-title{margin:0 0 6px;font-size:28px;color:var(--accent-strong)}
.chapter-sub{margin:0 0 18px;font-size:13px;color:var(--muted)}
.page-block,.dialogue-scene,.card,.table-wrap{background:var(--panel);border:1px solid var(--border);
  border-radius:14px;box-shadow:0 6px 20px rgba(76,46,24,.06)}
.page-block,.dialogue-scene,.table-wrap{padding:16px 18px;margin-bottom:16px}
.block-title{margin-bottom:12px;font-size:17px;font-weight:700;color:var(--accent-strong)}
.sub-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.sub-tab-btn{border:1px solid var(--border);border-radius:999px;padding:7px 14px;background:#fff;
  color:var(--text);cursor:pointer}
.sub-tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.sub-section{display:none}
.sub-section.active{display:block}
/* ---- 注音行：拼音永遠在對應詞組正上方 ---- */
.yue-row{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px 10px;
  line-height:1.35;padding-left:var(--play-slot,0px);min-height:34px}
.tok{display:inline-flex;flex-direction:column;align-items:center;cursor:pointer;border-radius:8px;padding:2px 4px}
.tok:hover{background:var(--highlight)}
.tok .jp{font-size:12px;color:var(--pinyin);line-height:1.25;white-space:nowrap}
.tok .zh{font-size:21px;letter-spacing:.04em}
.tok.plain{cursor:default}
.tok.plain:hover{background:none}
.tok .zh .weak{border-bottom:2px dotted var(--weak)}
body.hide-pinyin .jp{visibility:hidden}
body.hide-weak .zh .weak{border-bottom:none}
/* ---- 英文行：默認隱藏 ---- */
.en-row{display:none;margin-top:5px;padding-left:var(--play-slot,0px);font-size:14px;
  line-height:1.6;color:var(--en);font-family:Georgia,"Times New Roman",serif;font-style:italic}
body.show-en .en-row{display:block}
.en-row::before{content:"EN ";font-style:normal;font-family:inherit;font-size:10px;
  letter-spacing:.08em;color:#8fb3a4;margin-right:6px}
.en-inline{display:none;margin-left:8px;font-size:13px;color:var(--en);font-style:italic}
body.show-en .en-inline{display:inline}
.speaking{background:var(--speaking)!important;outline:2px solid #f2b948}
.play-btn{position:absolute;left:0;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:0;
  display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);
  border-radius:999px;background:#fff;color:var(--accent-strong);cursor:pointer;font-size:12px}
.has-play{--play-slot:44px}
.card{padding:12px 14px;margin-bottom:10px}
.card .zh-note{margin-top:6px;padding-left:var(--play-slot,0px);font-size:13px;color:#6b5c4d}
.dialogue-line{margin-bottom:10px;padding:12px 14px;background:#fffaf4;border:1px solid #eadcca;border-radius:12px}
.scene-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;
  font-weight:700;color:var(--accent-strong)}
.scene-btn{border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--accent-strong);
  cursor:pointer;padding:4px 10px;font-size:12px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid var(--border);padding:9px 11px;vertical-align:middle;text-align:left}
th{background:var(--panel-alt);font-size:13px}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-width:78px;padding:8px 10px;background:#fff;border:1px solid var(--border);border-radius:12px;
  text-align:center;cursor:pointer}
.chip:hover{background:var(--highlight)}
.chip .jp{display:block;font-size:12px;color:var(--pinyin);margin-bottom:2px}
.chip .zh{font-size:22px}
.group{margin-bottom:16px}
.group-label{display:inline-block;margin-bottom:8px;padding:3px 10px;border-radius:999px;
  background:var(--panel-alt);font-size:13px;font-weight:700;color:var(--accent-strong)}
.group-note{margin-left:8px;font-size:12px;color:var(--muted);font-weight:400}
.tag{display:inline-block;margin:0 3px 3px 0;padding:1px 7px;border-radius:999px;font-size:11px;
  background:#f0e3d2;color:#8a6a48}
.tag.hard{background:#fbe0da;color:#a8392a}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;
  background:#fff;font-size:13px}
.pill{border:1px solid var(--border);border-radius:999px;padding:6px 12px;background:#fff;cursor:pointer;font-size:13px}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.kpi{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.kpi div{flex:1;min-width:130px;padding:12px 14px;background:#fff;border:1px solid var(--border);border-radius:12px}
.kpi b{display:block;font-size:24px;color:var(--accent-strong)}
.kpi span{font-size:12px;color:var(--muted)}
.hint{padding:12px 14px;background:#fff6e8;border:1px dashed #e0c49b;border-radius:12px;
  font-size:13px;color:#7a5c34;margin-bottom:14px;line-height:1.7}
code{background:#f3ece1;padding:1px 6px;border-radius:5px;font-size:12px}
@media(max-width:900px){body{display:block}#sidebar{width:auto;min-width:0}#main{padding:16px}}
</style>
</head>
<body>
<nav id="sidebar">
  <h1>粵語就這麼簡單<br><small style="font-size:11px;color:#cbbca6">粵拼注音 · 中英對照</small></h1>
  <div id="nav-list"></div>
  <div id="controls">
    <label>點讀速度：<span id="speed-display">1.0×</span></label>
    <input type="range" id="speed-slider" min="0.5" max="2.0" step="0.1" value="1.0">
    <button id="stop-btn" type="button">停止朗讀</button>
  </div>
</nav>
<main id="main">
  <div id="readbar">
    <button id="readall-btn" type="button">朗讀本章</button>
    <button id="toggle-pinyin-btn" type="button">隱藏拼音</button>
    <button id="toggle-en-btn" type="button" class="off">顯示英語</button>
    <button id="toggle-weak-btn" type="button">隱藏生字標記</button>
    <span id="status"></span>
  </div>
  <div id="chapter-container"></div>
</main>

<script>
(function(){
'use strict';
const PUNCT = '，。！？、,.!?;；:：…（）()《》“”‘’"\'—-~· ';
const weakSet = new Set([...(typeof WEAK_CHARS === 'string' ? WEAK_CHARS : (WEAK_CHARS || []).join(''))]
  .filter(function(c){ return c.trim(); }));

/* ---------------- 粵拼查詢 ---------------- */
function stripPunct(s){
  let a = 0, b = s.length;
  while (a < b && PUNCT.includes(s[a])) a++;
  while (b > a && PUNCT.includes(s[b-1])) b--;
  return s.slice(a, b);
}
function isCJK(ch){ return ch >= '\u3400' && ch <= '\u9fff'; }
function lookupJP(token){
  const core = stripPunct(token);
  if (!core) return '';
  if (JP_WORD[core]) return JP_WORD[core];
  if (JP_CHAR[core]) return JP_CHAR[core];
  const out = [];
  let i = 0;
  while (i < core.length){
    let hit = null;
    for (let len = Math.min(5, core.length - i); len >= 2; len--){
      const seg = core.substr(i, len);
      if (JP_WORD[seg]){ hit = JP_WORD[seg]; i += len; break; }
    }
    if (hit){ out.push(hit); continue; }
    const ch = core[i]; i++;
    if (JP_CHAR[ch]) out.push(JP_CHAR[ch]);
  }
  return out.join(' ');
}
/* ---------------- 難點音自動判定 ---------------- */
function hardTags(jp){
  const t = [];
  if (/^ng/.test(jp)) t.push('ng 聲母');
  if (/^(gw|kw)/.test(jp)) t.push('圓唇 gw/kw');
  if (/(oe|eo)/.test(jp)) t.push('oe/eo 韻');
  if (/yu/.test(jp)) t.push('yu 撮口');
  if (/[ptk]\d$/.test(jp)) t.push('入聲');
  if (/^(m|ng)\d$/.test(jp)) t.push('鼻音自成音節');
  if (/[456]$/.test(jp)) t.push('低聲調 4/5/6');
  return t;
}
/* ---------------- 渲染 ---------------- */
function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function tokenHTML(token){
  const jp = lookupJP(token);
  const chars = [...token].map(function(c){
    return isCJK(c) ? '<span class="' + (weakSet.has(c) ? 'weak' : '') + '">' + esc(c) + '</span>' : esc(c);
  }).join('');
  if (!jp) return '<span class="tok plain"><span class="jp"></span><span class="zh">' + chars + '</span></span>';
  return '<span class="tok" data-speak="' + esc(stripPunct(token)) + '">' +
    '<span class="jp">' + esc(jp) + '</span><span class="zh">' + chars + '</span></span>';
}
function annotate(text){
  return (text || '').trim().split(/\s+/).filter(Boolean).map(tokenHTML).join('');
}
function plain(text){ return (text || '').replace(/\s+/g, ''); }
function enHTML(en){ return en ? '<div class="en-row">' + esc(en) + '</div>' : ''; }
function rowHTML(text, withPlay, en){
  const btn = withPlay ? '<button class="play-btn" type="button" data-play="' + esc(plain(text)) + '">▶</button>' : '';
  return '<div class="yue-row' + (withPlay ? ' has-play' : '') + '">' + btn + annotate(text) + '</div>' + enHTML(en);
}
function rowText(row){
  const b = row.querySelector('[data-play]');
  if (b && b.dataset.play) return b.dataset.play;
  return [...row.querySelectorAll('.zh')].map(function(e){ return e.textContent; }).join('');
}
function chipHTML(ch, jp){
  return '<div class="chip" data-speak="' + esc(ch) + '"><span class="jp">' + esc(jp) +
    '</span><span class="zh">' + esc(ch) + '</span></div>';
}

/* ---------------- 字詞索引與統計 ---------------- */
const INDEX = { charFreq:{}, wordFreq:{}, examples:{}, firstAt:{} };
function indexContent(){
  Object.keys(PART2).forEach(function(cid){
    const d = PART2[cid], bag = [];
    d.phrases.forEach(function(p){ bag.push(p); });
    d.dialogues.forEach(function(s){ s.lines.forEach(function(l){ bag.push(l.yue); }); });
    d.vocab.definitions.forEach(function(x){ bag.push(x.example); });
    d.vocab.related.forEach(function(r){ bag.push(r.word + ' ' + r.related.split('、').join(' ')); });
    d.grammar.forEach(function(g){ bag.push(g.yue); });
    bag.forEach(function(line){
      (line || '').trim().split(/\s+/).filter(Boolean).forEach(function(tok){
        const core = stripPunct(tok);
        if (core.length > 1 && [...core].every(isCJK)) INDEX.wordFreq[core] = (INDEX.wordFreq[core] || 0) + 1;
        [...core].forEach(function(ch){
          if (!isCJK(ch)) return;
          INDEX.charFreq[ch] = (INDEX.charFreq[ch] || 0) + 1;
          if (!INDEX.firstAt[ch]) INDEX.firstAt[ch] = d.navLabel;
          if (!INDEX.examples[ch]) INDEX.examples[ch] = [];
          if (INDEX.examples[ch].length < 3 && INDEX.examples[ch].indexOf(line) < 0) INDEX.examples[ch].push(line);
        });
      });
    });
  });
}

  let rows = Object.keys(INDEX.charFreq).map(function(ch){
    const jp = JP_CHAR[ch] || '';
    return { ch:ch, jp:jp, n:INDEX.charFreq[ch], tags:hardTags(jp), at:INDEX.firstAt[ch] || '' };
  });
  if (statFilter === 'weak') rows = rows.filter(function(r){ return weakSet.has(r.ch); });
  if (statFilter === 'hard') rows = rows.filter(function(r){ return r.tags.length >= 2; });
  if (statFilter === 'top')  rows = rows.filter(function(r){ return r.n >= 10; });
  if (statQuery) rows = rows.filter(function(r){ return r.ch.includes(statQuery) || r.jp.includes(statQuery); });
  rows.sort(statSort === 'freq' ? function(a,b){ return b.n - a.n; } : function(a,b){ return a.jp.localeCompare(b.jp); });
  host.innerHTML =
    '<div class="kpi">' +
      '<div><b>' + Object.keys(INDEX.charFreq).length + '</b><span>正文出現的單字</span></div>' +
      '<div><b>' + Object.keys(INDEX.wordFreq).length + '</b><span>正文詞組</span></div>' +
      '<div><b>' + Object.keys(JP_WORD).length + '</b><span>詞典詞條</span></div>' +
      '<div><b>' + weakSet.size + '</b><span>已標記未掌握</span></div></div>' +
    '<div class="table-wrap"><table><thead><tr><th style="width:70px">字</th><th style="width:100px">粵拼</th>' +
    '<th style="width:80px">出現次數</th><th>難點提示</th><th style="width:150px">首次出現</th>' +
    '<th style="width:90px">狀態</th></tr></thead><tbody>' +
    rows.slice(0, 400).map(function(r){
      return '<tr><td><span class="chip" style="min-width:0;padding:4px 8px;display:inline-block" data-speak="' + esc(r.ch) + '">' +
        '<span class="zh" style="font-size:20px">' + esc(r.ch) + '</span></span></td>' +
        '<td style="color:var(--pinyin)">' + esc(r.jp) + '</td><td>' + r.n + '</td>' +
        '<td>' + (r.tags.length ? r.tags.map(function(t){ return '<span class="tag hard">' + esc(t) + '</span>'; }).join('') : '<span class="tag">常規</span>') + '</td>' +
        '<td style="font-size:12px;color:var(--muted)">' + esc(r.at) + '</td>' +
        '<td>' + (weakSet.has(r.ch) ? '<span class="tag hard">未掌握</span>' : '<span class="tag">—</span>') + '</td></tr>';
    }).join('') + '</tbody></table>' +
    (rows.length > 400 ? '<p style="font-size:12px;color:var(--muted)">僅顯示前 400 條，可用搜索縮小範圍。</p>' : '') + '</div>';
}
function renderDrill(){
  const host = document.querySelector('#drill .drill-host');
  if (!host) return;
  const list = [...weakSet].filter(function(ch){ return INDEX.charFreq[ch]; })
    .sort(function(a,b){ return INDEX.charFreq[b] - INDEX.charFreq[a]; });
  const miss = [...weakSet].filter(function(ch){ return !INDEX.charFreq[ch]; });
  if (!list.length){
    host.innerHTML = '<div class="page-block">WEAK_CHARS 裏還沒有字。打開源碼，在數據區第 ① 塊寫上要強化的字即可，例如：<br>' +
      '<code>const WEAK_CHARS = "嘅嘢嗰咗";</code></div>';
    return;
  }
  host.innerHTML = '<div class="page-block"><div class="block-title">共 ' + list.length + ' 個待強化的字</div>' +
    list.map(function(ch){
      const jp = JP_CHAR[ch] || '';
      const words = Object.keys(INDEX.wordFreq).filter(function(w){ return w.includes(ch); }).slice(0, 8);
      return '<div class="card"><div class="yue-row has-play">' +
        '<button class="play-btn" type="button" data-play="' + esc(ch) + '">▶</button>' + tokenHTML(ch) +
        '<span style="margin-left:8px">' + hardTags(jp).map(function(t){ return '<span class="tag hard">' + esc(t) + '</span>'; }).join('') +
        '<span class="tag">出現 ' + INDEX.charFreq[ch] + ' 次</span></span></div>' +
        (words.length ? '<div class="yue-row">' + words.map(tokenHTML).join('') + '</div>' : '') +
        (INDEX.examples[ch] || []).slice(0, 2).map(function(l){ return rowHTML(l, true); }).join('') + '</div>';
    }).join('') + '</div>' +
    (miss.length ? '<div class="hint">這些字沒在正文裏出現過：' + esc(miss.join(' ')) + '</div>' : '');
}
function buildExtra(){
  return [
    { id:'stats', part:'PART 3 字詞管理', nav:'3-01 字頻統計', title:'3-01 字頻與難點統計',
      sub:'統計正文裏每個字的出現次數，並自動標出粵語難點音。',
      html:'<div class="hint">「未掌握」狀態來自數據區第 ① 塊的 <code>WEAK_CHARS</code>，由你自己維護；' +
        '寫進去的字會在正文里加紅色虛線下劃線，並彙總到「3-02 強化練習」。</div>' +
        '<div class="toolbar"><input id="stat-q" placeholder="搜索漢字或粵拼…">' +
        '<button class="pill active" data-filter="all">全部</button>' +
        '<button class="pill" data-filter="top">高頻（≥10 次）</button>' +
        '<button class="pill" data-filter="hard">難點音</button>' +
        '<button class="pill" data-filter="weak">未掌握</button>' +
        '<select id="stat-sort"><option value="freq">按出現次數</option><option value="jp">按粵拼排序</option></select></div>' +
        '<div class="stat-host"></div>' },
    { id:'drill', part:'PART 3 字詞管理', nav:'3-02 強化練習', title:'3-02 未掌握字強化',
      sub:'把 WEAK_CHARS 裏的字，連同含它的詞組和課文例句集中起來反覆點讀。',
      html:'<div class="drill-host"></div>' }
  ];
}
/* ---------------- 朗讀 ---------------- */
let voice = null, reading = false, loopState = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices() || [];
  const score = function(v){
    const l = (v.lang || '').toLowerCase(), n = (v.name || '').toLowerCase();
    let s = 0;
    if (l === 'yue-hk') s += 200;
    if (l === 'zh-hk') s += 180;
    if (l.indexOf('yue') === 0) s += 160;
    if (l.includes('hk')) s += 120;
    if (l.indexOf('zh') === 0) s += 60;
    if (n.includes('cantonese') || n.includes('粵') || n.includes('廣東')) s += 200;
    if (n.includes('hong kong') || n.includes('香港')) s += 120;
    return s;
  };
  const best = vs.slice().sort(function(a,b){ return score(b) - score(a); })[0];
  voice = best && score(best) >= 120 ? best : null;
  if (!voice) document.getElementById('status').textContent = '未檢測到粵語語音包，個別字可能讀偏（建議安裝 Cantonese (Hong Kong) 語音）。';
}
function speed(){ return parseFloat(document.getElementById('speed-slider').value); }
function utter(text){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = voice ? (voice.lang || 'zh-HK') : 'zh-HK';
  u.rate = speed();
  if (voice) u.voice = voice;
  return u;
}
function stopSpeech(){
  speechSynthesis.cancel(); reading = false;
  if (loopState && loopState.btn){ loopState.btn.textContent = '循環播放'; loopState.btn.classList.remove('speaking'); }
  loopState = null;
  document.querySelectorAll('.speaking').forEach(function(el){ el.classList.remove('speaking'); });
  document.getElementById('status').textContent = '';
}
function speakText(text, el){
  stopSpeech();
  if (!text) return;
  const repetitions = el && el.classList.contains('play-btn') ? SENTENCE_PLAY_REPETITIONS : 1;
  let rep = 0;
  if (el) el.classList.add('speaking');
  (function speakNext(){
    const u = utter(text);
    u.onend = function(){
      rep++;
      if (rep < repetitions) speakNext();
      else if (el) el.classList.remove('speaking');
    };
    u.onerror = function(){ if (el) el.classList.remove('speaking'); };
    speechSynthesis.speak(u);
  })();
}
function loopScene(btn){
  const scene = btn.closest('.dialogue-scene');
  if (loopState && loopState.scene === scene){ stopSpeech(); return; }
  stopSpeech();
  loopState = { scene:scene, btn:btn, lines:[...scene.querySelectorAll('.dialogue-line')], i:0, rep:0 };
  btn.textContent = '停止循環'; btn.classList.add('speaking');
  (function step(){
    if (!loopState) return;
    const line = loopState.lines[loopState.i];
    line.classList.add('speaking');
    line.scrollIntoView({ behavior:'smooth', block:'nearest' });
    const u = utter(rowText(line.querySelector('.yue-row')));
    u.onend = u.onerror = function(){
      line.classList.remove('speaking');
      if (!loopState) return;
      if (loopState.rep < SCENE_LOOP_REPETITIONS - 1) loopState.rep++;
      else { loopState.rep = 0; loopState.i = (loopState.i + 1) % loopState.lines.length; }
      step();
    };
    speechSynthesis.speak(u);
  })();
}
function readChapter(){
  stopSpeech();
  const ch = document.querySelector('.chapter.active');
  if (!ch) return;
  const rows = [...ch.querySelectorAll('.yue-row')].filter(function(r){
    const sec = r.closest('.sub-section');
    return (!sec || sec.classList.contains('active')) && rowText(r).length;
  });
  if (!rows.length){ document.getElementById('status').textContent = '本章暫無可朗讀內容'; return; }
  let i = 0, rep = 0; reading = true;
  (function next(){
    if (!reading || i >= rows.length){ reading = false; document.getElementById('status').textContent = ''; return; }
    const row = rows[i];
    document.getElementById('status').textContent = '朗讀中 ' + (i + 1) + '/' + rows.length + '（第 ' + (rep + 1) + '/' + CHAPTER_READ_REPETITIONS + ' 遍）';
    row.classList.add('speaking');
    row.scrollIntoView({ behavior:'smooth', block:'nearest' });
    const u = utter(rowText(row));
    u.onend = u.onerror = function(){
      row.classList.remove('speaking');
      if (!reading) return;
      if (rep < CHAPTER_READ_REPETITIONS - 1) rep++; else { rep = 0; i++; }
      next();
    };
    speechSynthesis.speak(u);
  })();
}
/* ---------------- 裝配 ---------------- */
function mount(sections){
  document.getElementById('chapter-container').innerHTML = sections.map(function(s){
    return '<section class="chapter" id="' + s.id + '"><h2 class="chapter-title">' + esc(s.title) + '</h2>' +
      '<p class="chapter-sub">' + esc(s.sub || '') + '</p>' + s.html + '</section>';
  }).join('');
  const parts = [];
  sections.forEach(function(s){
    let p = parts.filter(function(x){ return x.label === s.part; })[0];
    if (!p){ p = { label:s.part, items:[] }; parts.push(p); }
    p.items.push(s);
  });
  document.getElementById('nav-list').innerHTML = parts.map(function(p){
    return '<div class="nav-part">' + esc(p.label) + '</div>' + p.items.map(function(s){
      return '<button class="nav-btn" data-target="' + s.id + '">' + esc(s.nav) + '</button>';
    }).join('');
  }).join('');
}
function showChapter(id){
  stopSpeech();
  document.querySelectorAll('.chapter').forEach(function(c){ c.classList.toggle('active', c.id === id); });
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.target === id); });
  document.getElementById('main').scrollTop = 0;
  if (id === 'stats') renderStats();
  if (id === 'drill') renderDrill();
}
document.addEventListener('click', function(e){
  const nav = e.target.closest('.nav-btn'); if (nav) return showChapter(nav.dataset.target);
  const tab = e.target.closest('.sub-tab-btn');
  if (tab){
    const chap = tab.closest('.chapter');
    chap.querySelectorAll('.sub-tab-btn').forEach(function(b){ b.classList.toggle('active', b === tab); });
    chap.querySelectorAll('.sub-section').forEach(function(s){ s.classList.toggle('active', s.dataset.tab === tab.dataset.tab); });
    return;
  }
  const play = e.target.closest('[data-play]'); if (play) return speakText(play.dataset.play, play);
  const loop = e.target.closest('[data-loop]'); if (loop) return loopScene(loop);
  const tok = e.target.closest('[data-speak]'); if (tok) return speakText(tok.dataset.speak, tok);
  const pill = e.target.closest('.pill');
  if (pill){
    document.querySelectorAll('.pill').forEach(function(p){ p.classList.toggle('active', p === pill); });
    statFilter = pill.dataset.filter; renderStats();
  }
});
document.addEventListener('input', function(e){
  if (e.target.id === 'stat-q'){ statQuery = e.target.value.trim(); renderStats(); }
  if (e.target.id === 'speed-slider') document.getElementById('speed-display').textContent = speed().toFixed(1) + '×';
});
document.addEventListener('change', function(e){
  if (e.target.id === 'stat-sort'){ statSort = e.target.value; renderStats(); }
});
function init(){
  pickVoice();
  speechSynthesis.addEventListener('voiceschanged', pickVoice);
  indexContent();
  mount([].concat(buildPart1(), buildPart2(), buildExtra()));
  const p = document.getElementById('toggle-pinyin-btn'),
        en = document.getElementById('toggle-en-btn'),
        w = document.getElementById('toggle-weak-btn');
  p.addEventListener('click', function(){
    const off = document.body.classList.toggle('hide-pinyin');
    p.textContent = off ? '顯示拼音' : '隱藏拼音'; p.classList.toggle('off', off);
  });
  en.addEventListener('click', function(){
    const on = document.body.classList.toggle('show-en');
    en.textContent = on ? '隱藏英語' : '顯示英語'; en.classList.toggle('off', !on);
  });
  w.addEventListener('click', function(){
    const off = document.body.classList.toggle('hide-weak');
    w.textContent = off ? '顯示生字標記' : '隱藏生字標記'; w.classList.toggle('off', off);
  });
  document.getElementById('stop-btn').addEventListener('click', stopSpeech);
  document.getElementById('readall-btn').addEventListener('click', readChapter);
  showChapter('p1-initial');
}
window.addEventListener('DOMContentLoaded', init);
})();
</script>
