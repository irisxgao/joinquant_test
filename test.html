<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background-color: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #5568d3;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background-color: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }
        
        .btn-secondary:hover {
            background-color: #e0e0e0;
        }
        
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-left: 4px solid #667eea;
            border-radius: 5px;
            display: none;
        }
        
        #result.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 欢迎来到测试页面</h1>
        <p>这是一个标准的 HTML 测试文件，包含了基础的结构、样式和交互功能。</p>
        <p>点击下方按钮进行测试操作。</p>
        
        <div class="button-group">
            <button class="btn-primary" onclick="showMessage()">点击我</button>
            <button class="btn-secondary" onclick="clearMessage()">清除</button>
        </div>
        
        <div id="result">
            <strong>✓ 成功！</strong> 这是一条测试消息，时间为: <span id="timestamp"></span>
        </div>
    </div>
    
    <script>
        function showMessage() {
            const resultDiv = document.getElementById('result');
            const timestamp = document.getElementById('timestamp');
            const now = new Date();
            timestamp.textContent = now.toLocaleString('zh-CN');
            resultDiv.classList.add('show');
        }
        
        function clearMessage() {
            const resultDiv = document.getElementById('result');
            resultDiv.classList.remove('show');
        }
        
        // 页面加载完成的提示
        document.addEventListener('DOMContentLoaded', function() {
            console.log('测试页面已加载完成！');
        });
    </script>
</body>
</html>
