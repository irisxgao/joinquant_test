<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韩语字卡 · 掌握度测试</title>
<style>
  :root{
    --bg:#0f1117; --panel:#181b25; --panel2:#1f2331; --line:#2b3040;
    --txt:#e8eaf0; --dim:#9aa3b8; --accent:#5b8cff; --good:#2ecc71;
    --warn:#f5a623; --bad:#ff5c5c; --gold:#ffd166;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;padding:16px;min-height:100vh}
  .wrap{max-width:880px;margin:0 auto}
  h1{font-size:20px;font-weight:600;margin-bottom:4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px;line-height:1.6}
  .decks{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
  .deck{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:.15s}
  .deck:hover{border-color:var(--accent);transform:translateY(-2px)}
  .deck.on{border-color:var(--accent);background:var(--panel2);box-shadow:0 0 0 1px var(--accent) inset}
  .deck .t{font-weight:600;font-size:14px}
  .deck .d{color:var(--dim);font-size:12px;margin-top:3px;line-height:1.5}
  .deck .p{height:4px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
  .deck .p i{display:block;height:100%;background:var(--good);width:0;transition:.3s}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  button{font-family:inherit;font-size:13px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent)}
  button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .stats{margin-left:auto;color:var(--dim);font-size:12px;display:flex;gap:14px}
  .stats b{color:var(--txt)}
  .prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:12px 0}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good));width:0;transition:.3s}

  .card{background:linear-gradient(160deg,#20263a,#161a26);border:1px solid var(--line);border-radius:20px;
    min-height:470px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;position:relative;user-select:text;padding:54px 24px 48px}
  .glyph{font-size:104px;line-height:1.2;font-weight:500;letter-spacing:2px;text-align:center}
  .say{cursor:pointer;transition:.15s;border-radius:12px;padding:2px 14px}
  .say:hover{background:rgba(91,140,255,.14)}
  .say:active{transform:scale(.97)}
  .say::after{content:"🔊";font-size:.32em;opacity:.35;margin-left:10px;vertical-align:middle}
  .say.playing{background:rgba(91,140,255,.24)}
  .word{margin-top:22px;text-align:center;border-top:1px solid var(--line);padding-top:18px;width:100%}
  .word-list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:start}
  .word-entry{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:10px;padding:8px 4px}
  .word .kw{font-size:18px;font-weight:600;letter-spacing:.5px;line-height:1.45;display:block;word-break:keep-all}
  .word .kw.say{padding:2px 4px}
  .word .kw.say::after{font-size:10px;margin-left:4px}
  .word .kr{font-size:11px;color:var(--gold);margin-top:3px;line-height:1.4;word-break:break-all}
  .word .kc{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.4}
  .word .none{font-size:12px;color:var(--dim);font-style:italic;line-height:1.6}
  .hl{color:var(--accent);font-weight:700}
  .hl2{color:var(--accent);opacity:.85;border-bottom:1px dashed var(--accent)}
  .sent{margin-top:18px;width:100%;text-align:center;border-top:1px dashed var(--line);padding-top:16px}
  .sent .sk{font-size:21px;font-weight:600;line-height:1.6;display:inline-block}
  .sent .sk.say{padding:4px 12px}
  .sent .sk.say::after{font-size:12px;margin-left:8px}
  .sent .sr{font-size:12px;color:var(--gold);margin-top:6px;line-height:1.5}
  .sent .sc{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.5}
  .sent .src{font-size:11px;color:var(--dim);opacity:.75;margin-top:6px}
  @media(max-width:640px){
    .word-list{grid-template-columns:repeat(5,minmax(64px,1fr));overflow-x:auto}
    .word .kw{font-size:15px}
    .sent .sk{font-size:17px}
  }
  #front,#back{display:flex;flex-direction:column;align-items:center}
  #back{animation:fade .2s}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .rom{font-size:42px;font-weight:600;color:var(--gold);letter-spacing:1px;line-height:1.4;margin-top:6px}
  .cn{font-size:15px;color:var(--dim);margin-top:10px;line-height:1.6;text-align:center}
  .hint{color:var(--dim);font-size:12px;position:absolute;bottom:16px;left:0;right:0;text-align:center}
  .tag{position:absolute;top:14px;left:16px;font-size:11px;color:var(--dim)}
  .lvl{position:absolute;top:14px;right:16px;font-size:11px}
  .grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .grade button{padding:14px;font-size:14px;font-weight:600}
  #b0{border-color:var(--bad);color:var(--bad)} #b1{border-color:var(--warn);color:var(--warn)}
  #b2{border-color:var(--good);color:var(--good)}
  .chart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px;overflow-x:auto}
  table{border-collapse:collapse;font-size:13px;width:100%}
  td,th{border:1px solid var(--line);padding:5px 4px;text-align:center;min-width:44px}
  th{color:var(--dim);font-weight:500;background:var(--panel2)}
  td span{display:block;font-size:16px} td small{color:var(--dim);font-size:10px}
  td.k{background:#1b2c1e} td.m{background:#3a3118} td.w{background:#2e1f1f}
  .hide{display:none}
  .browse{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
  .bnote{color:var(--dim);font-size:13px;line-height:1.75;margin-bottom:16px;
    border-left:3px solid var(--warn);padding-left:12px}
  .bnote b{color:var(--txt)}
  .bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .bcell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:10px 4px;text-align:center;cursor:pointer;transition:.12s}
  .bcell:hover{border-color:var(--accent);background:rgba(91,140,255,.12)}
  .bcell.playing{border-color:var(--accent);background:rgba(91,140,255,.26)}
  .bcell .bg{display:block;font-size:28px;line-height:1.3}
  .bcell .br{display:block;font-size:11px;color:var(--gold);margin-top:2px}
  .bcell .bc{display:block;font-size:10px;color:var(--dim);margin-top:2px}
  .done{text-align:center;padding:30px 10px}
  .done h2{font-size:26px;margin-bottom:8px}
  .weak{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
  .weak span{background:var(--panel2);border:1px solid var(--bad);border-radius:8px;padding:4px 8px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>韩语字卡 · 掌握度测试</h1>
  <div class="sub">正面：大字 + <b>同排最多 5 个例词</b>（歌词高频词，或发音贴近英文 / 中文的词）+ <b>1 句歌词风例句</b>。例词与例句都<b>只收含有这个字本身</b>的内容，该字以蓝色高亮；字母卡则高亮所有含该字母的音节。点<b>字</b>、<b>词</b>、<b>句子</b>都可发音（0.7 倍速，可反复点）；点卡片空白处或空格键翻面看拼读。点「已掌握」会暂时出库；点「有点会，再出现几次」会在本轮回归；点「不会，后面再学」会封存到下一轮。每次点「开始 / 重新洗牌」就算开启新一轮学习。生僻音节已单独归到第 ⑤ 组，只看不背。</div>

  <div class="decks" id="decks"></div>

  <div class="bar">
    <button class="pri" id="btnStart">开始 / 重新洗牌</button>
    <button id="btnWeak">只练 1 / 2 类</button>
    <button id="btnHard">查看 1 类清单</button>
    <button id="btnSound">🔊 重听 (R)　0.7x</button>
    <button id="btnChart">查看全表</button>
    <button id="btnExport">导出已掌握</button>
    <button id="btnReset">清空记录</button>
    <div class="stats">
      <span>剩余 <b id="sLeft">0</b></span>
      <span>已掌握 <b id="sDone">0</b></span>
      <span>待巩固 <b id="sAcc">0</b></span>
    </div>
  </div>

  <div class="prog"><i id="progBar"></i></div>

  <div id="stage"></div>
  <div id="chart" class="chart hide"></div>
  <div id="hardBox" class="chart hide"></div>
  <div id="exportBox" class="chart hide"></div>
</div>

<script>
/* ================= 字表数据 ================= */
const CHO   = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const CHO_R = ["g","kk","n","d","tt","r","m","b","pp","s","ss","","j","jj","ch","k","t","p","h"];
const JUNG   = ["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
const JUNG_R = ["a","ae","ya","yae","eo","e","yeo","ye","o","wa","wae","oe","yo","u","wo","we","wi","yu","eu","ui","i"];
const JUNG_CN= ["啊","诶","呀","耶","哦(嘴不圆)","诶","哟(约)","耶","喔(嘴圆)","哇","歪","威","哟","乌","我","喂","威(wi)","优","呃(扁嘴)","呃衣","衣"];
const CHO_CN = ["g/k 介于「哥」与「科」","kk 硬音，紧喉的「嘎」","n 那","d/t 介于「德」与「特」","tt 硬音，紧喉的「搭」","r/l 舌尖轻弹","m 妈","b/p 介于「波」与「坡」","pp 硬音，紧喉的「波」","s 思","ss 硬音，紧喉的「思」","首位不发音，收尾读 ng","j 介于「知」与「吃」","jj 硬音，紧喉的「基」","ch 送气的「吃」","k 送气的「科」","t 送气的「特」","p 送气的「坡」","h 喝"];

const JAMO=[];
CHO.forEach((c,i)=>JAMO.push({g:c,r:CHO_R[i]||"ng / 无声",cn:CHO_CN[i],t:"辅音"}));
JUNG.forEach((v,i)=>JAMO.push({g:v,r:JUNG_R[i],cn:JUNG_CN[i],t:"元音"}));

const syl=(c,v,f=0)=>String.fromCharCode(0xAC00+(c*21+v)*28+f);
const mk =(c,v)=>({g:syl(c,v),r:(CHO_R[c]||"")+JUNG_R[v],cn:CHO[c]+" + "+JUNG[v],t:"音节"});

const BASIC_C=[0,2,3,5,6,7,9,11,12,14,15,16,17,18], BASIC_V=[0,2,4,6,8,12,13,17,18,20];
const T140=[]; BASIC_C.forEach(c=>BASIC_V.forEach(v=>T140.push(mk(c,v))));
const T399=[]; CHO.forEach((_,c)=>JUNG.forEach((_,v)=>T399.push(mk(c,v))));

const BJ=[["ㄱ","k"],["ㄲ","k"],["ㄳ","k"],["ㄴ","n"],["ㄵ","n"],["ㄶ","n"],["ㄷ","t"],["ㄹ","l"],
["ㄺ","k"],["ㄻ","m"],["ㄼ","l"],["ㄽ","l"],["ㄾ","l"],["ㄿ","p"],["ㅀ","l"],["ㅁ","m"],["ㅂ","p"],
["ㅄ","p"],["ㅅ","t"],["ㅆ","t"],["ㅇ","ng"],["ㅈ","t"],["ㅊ","t"],["ㅋ","k"],["ㅌ","t"],["ㅍ","p"],["ㅎ","t"]];
const BATCHIM=BJ.map((x,i)=>({g:syl(11,0,i+1),r:"a"+x[1],cn:"收音 "+x[0]+" → 实际读 ["+x[1]+"]",t:"받침"}));

/* 生僻音节：理论上拼得出、日常几乎不成词，只看不背 */
const RARE=new Set("궈긔꺄꺠꼐꾜뀨끠냬녜놰눼댸뎨돠뒈듸땨떄뗘뗴뙈뙤뚀뚸뛔뜌럐뢔뤄뤠뤼릐먜뫄뫠뭬뮈믜뱨볘붜붸븨뺘뺴뻬뼤뽜뽸뾔뿨쀄쀠쀼쁴솨숴싀쌰썌쎄쎠쎼쏴쑈쒜쒸쓔졔좨줴즤쨔쨰쩨쪠쫴쬬쮀쮜쮸쯔쯰챼쳬촤쵀츼컈켸쾨킈턔톄톼퇘퉈퉤퍠퐈퐤푀풔풰퓌픠햬훠뇨뉘뫼몌쇄췌".split(""));
const T_USE  = [];   // 实用音节
const T_RARE = [];   // 生僻音节

const DECKS={
  jamo:{name:"① 基础字母 40",desc:"19 辅音 + 21 元音，入门必背",data:JAMO},
  t140:{name:"② 反切表 140",desc:"14 常用辅音 × 10 基本元音",data:T140},
  t399:{name:"③ 实用音节",desc:"无收音全表 + 现有词中实际出现的带收音音节",data:T_USE},
  bat :{name:"④ 收音 받침 27",desc:"终声字母与实际发音",data:BATCHIM},
  rare:{name:"⑤ 生僻音节",desc:"只浏览不测试，点击可发音",data:T_RARE,browse:true}
};

const W_MASTERED_FLAT={};
const setMasteredWord=(store,g,word)=>{
  if(CHO.includes(g)){ store.jamo.consonants[g]=word; return; }
  if(JUNG.includes(g)){ store.jamo.vowels[g]=word; return; }
  if(g && g.length===1 && g.charCodeAt(0)>=0xAC00 && g.charCodeAt(0)<=0xD7A3){
    const ci=Math.floor((g.charCodeAt(0)-0xAC00)/(21*28));
    const bucket=CHO[ci];
    if(bucket){ store.syllable[bucket][g]=word; return; }
  }
  store.bat[g]=word;
};
function rebuildMasteredFlat(){
  Object.keys(W_MASTERED_FLAT).forEach(g=>delete W_MASTERED_FLAT[g]);
  Object.assign(W_MASTERED_FLAT, W_MASTERED.jamo.consonants, W_MASTERED.jamo.vowels, W_MASTERED.bat);
  CHO.forEach(c=>Object.assign(W_MASTERED_FLAT, W_MASTERED.syllable[c]));
}

function refreshRareDecks(){
  const rareSet=new Set(RARE);
  Object.keys(W_RARE).forEach(g=>rareSet.add(g));
  const cardOf=g=>{
    const offset=g.charCodeAt(0)-0xAC00;
    const consonant=Math.floor(offset/(21*28));
    const vowel=Math.floor((offset%(21*28))/28);
    const final=offset%28;
    return {
      g,
      r:(CHO_R[consonant]||"")+JUNG_R[vowel]+(final?BJ[final-1][1]:""),
      cn:CHO[consonant]+" + "+JUNG[vowel]+(final?" + 받침 "+BJ[final-1][0]:""),
      t:"音节"
    };
  };
  const practical=T399.filter(x=>!rareSet.has(x.g));
  const practicalSet=new Set(practical.map(x=>x.g));
  [...Object.values(W),...Object.values(W_MASTERED_FLAT),...COMMON_WORDS].forEach(word=>{
    [...word[0]].filter(isSyllableChar).forEach(g=>{
      if(!rareSet.has(g) && !practicalSet.has(g)){
        practical.push(cardOf(g)); practicalSet.add(g);
      }
    });
  });
  const rare=T399.filter(x=>rareSet.has(x.g));
  const rareSetBuilt=new Set(rare.map(x=>x.g));
  Object.keys(W_RARE).filter(isSyllableChar).forEach(g=>{
    if(!rareSetBuilt.has(g)){ rare.push(cardOf(g)); rareSetBuilt.add(g); }
  });
  T_USE.splice(0,T_USE.length,...practical);
  T_RARE.splice(0,T_RARE.length,...rare);
  DECKS.t399.name="③ 实用音节 "+T_USE.length;
  DECKS.rare.name="⑤ 生僻音节 "+T_RARE.length;
}

const jamoOf=g=>{

  return [CHO[Math.floor(o/(21*28))], JUNG[Math.floor((o%(21*28))/28)], f?BJ[f-1][0]:null].filter(Boolean);
};
const charHasJamo=(ch,j)=>isSyllableChar(ch)&&jamoOf(ch).includes(j);
const isJamoChar=g=>CHO.includes(g)||JUNG.includes(g);
const JAMO_INDEX={};
function rebuildJamoIndex(){
  Object.keys(JAMO_INDEX).forEach(k=>delete JAMO_INDEX[k]);
  const seen=new Set();
  [...Object.values(W),...Object.values(W_MASTERED_FLAT),...COMMON_WORDS].forEach(word=>{
    if(seen.has(word[0])) return;
    seen.add(word[0]);
    const set=new Set();
    [...word[0]].filter(isSyllableChar).forEach(ch=>jamoOf(ch).forEach(j=>set.add(j)));
    set.forEach(j=>{ (JAMO_INDEX[j]||(JAMO_INDEX[j]=[])).push(word); });
  });
}
rebuildJamoIndex();
const BAT_SET=new Set(BATCHIM.map(x=>x.g));
const batOf=g=>{ const f=(g.charCodeAt(0)-0xAC00)%28; return f?BJ[f-1][0]:null; };
const charHasBat=(ch,b)=>isSyllableChar(ch)&&batOf(ch)===b;
function wordsOf(g){
  const direct=wordOf(g);
  if(BAT_SET.has(g)){
    const b=batOf(g);
    const list=[...(direct?[direct]:[]),...[...Object.values(W),...Object.values(W_MASTERED_FLAT),...COMMON_WORDS]
      .filter(w=>[...w[0]].some(ch=>charHasBat(ch,b)))];
    return list.filter((w,i,l)=>l.findIndex(x=>x[0]===w[0])===i).slice(0,5);
  }
  if(isJamoChar(g)){
    const list=[...(direct?[direct]:[]),...(JAMO_INDEX[g]||[])];
    return list.filter((w,i,l)=>l.findIndex(x=>x[0]===w[0])===i).slice(0,5);
  }
  if(!isSyllableChar(g)) return direct?[direct]:[];
  const exact=direct?[direct,...(WORD_INDEX[g]||[])]:(WORD_INDEX[g]||[]);
  return exact.filter((w,i,list)=>list.findIndex(x=>x[0]===w[0])===i).slice(0,5);
}
function highlightedWord(text,g){
  if(BAT_SET.has(g)){
    const b=batOf(g);
    return [...text].map(ch=>charHasBat(ch,b)?`<span class="hl2">${ch}</span>`:ch).join("");
  }
  if(isJamoChar(g)){
    return [...text].map(ch=>charHasJamo(ch,g)?`<span class="hl2">${ch}</span>`:ch).join("");
  }
  return [...text].map(ch=>ch===g?`<span class="hl">${ch}</span>`:ch).join("");
}

const SENT_TEMPLATES=[
  w=>[`${w[0]} 그 한마디가 남았어`,`${w[1]} geu hanmadiga namasseo`,`只留下「${w[2]}」这一句`],
  w=>[`${w[0]} 생각나는 밤이야`,`${w[1]} saenggangnaneun bamiya`,`是想起「${w[2]}」的夜晚`],
  w=>[`${w[0]} 하나로 충분해요`,`${w[1]} hanaro chungbunhaeyo`,`有「${w[2]}」一个就够了`],
  w=>[`${w[0]} 노래처럼 흘러가`,`${w[1]} noraecheoreom heulleoga`,`「${w[2]}」像歌一样流淌`],
  w=>[`${w[0]} 다시 부르고 싶어`,`${w[1]} dasi bureugo sipeo`,`想再唱一次「${w[2]}」`]
];
const SENT_INDEX={};
SENTENCES.forEach(s=>{
  Array.from(new Set([...s[0]].filter(isSyllableChar))).forEach(g=>{
    (SENT_INDEX[g]||(SENT_INDEX[g]=[])).push(s);
  });
});
const hashOf=g=>[...g].reduce((a,c)=>a+c.charCodeAt(0),0);
function sentenceOf(g,words){
  if(isSyllableChar(g)&&!BAT_SET.has(g)){
    const list=SENT_INDEX[g];
    if(list&&list.length) return list[hashOf(g)%list.length];
  }
  if(BAT_SET.has(g)){
    const b=batOf(g);
    const list=SENTENCES.filter(s=>[...s[0]].some(ch=>charHasBat(ch,b)));
    if(list.length) return list[hashOf(g)%list.length];
  }
  if(isJamoChar(g)){
    const list=SENTENCES.filter(s=>[...s[0]].some(ch=>charHasJamo(ch,g)));
    if(list.length) return list[hashOf(g)%list.length];
  }
  const pool=(words||[]).filter(w=>[...w[0]].includes(g));
  const w=pool[0]||(words||[])[0];
  if(!w) return null;
  return SENT_TEMPLATES[hashOf(g)%SENT_TEMPLATES.length](w);
}

function currentMastered(){
  const out={
    jamo:{consonants:[],vowels:[]},
    syllable:Object.fromEntries(CHO.map(c=>[c,[]])),
    bat:[]
  };
  JAMO.forEach(x=>{ if(stateOf("jamo",x.g).s>=2){ (x.t==="辅音"?out.jamo.consonants:out.jamo.vowels).push(x.g); } });
  T399.forEach(x=>{
    if(stateOf("t399",x.g).s>=2 || stateOf("t140",x.g).s>=2){
      const c=choseOf(x.g);
      if(c) out.syllable[c].push(x.g);
    }
  });
  BATCHIM.forEach(x=>{ if(stateOf("bat",x.g).s>=2) out.bat.push(x.g); });
  out.jamo.consonants=sortedUnique(out.jamo.consonants);
  out.jamo.vowels=sortedUnique(out.jamo.vowels);
  CHO.forEach(c=>{ out.syllable[c]=sortedUnique(out.syllable[c]); });
  out.bat=sortedUnique(out.bat);
  return out;
}
function currentMasteredWordGroups(data){
  const out={
    jamo:{consonants:{},vowels:{}},
    syllable:Object.fromEntries(CHO.map(c=>[c,{}])),
    bat:{}

  [...data.jamo.consonants, ...data.jamo.vowels, ...data.bat].forEach(g=>{ const w=wordOf(g); if(w) setMasteredWord(out,g,w); });
  CHO.forEach(c=>data.syllable[c].forEach(g=>{ const w=wordOf(g); if(w) setMasteredWord(out,g,w); }));
  return out;
}

${baseIndent}}`;
}

  const raw=mem[key(deck,g)]||{};
  return {s:raw.s||0, hard:raw.hard||0, review:raw.review||raw.w||0, deferUntil:raw.deferUntil||0};
};

function play(t,el){
  if(!window.speechSynthesis||!t) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang="ko-KR"; u.rate=0.7; u.pitch=1;
  const v=speechSynthesis.getVoices().find(x=>x.lang.replace("_","-").startsWith("ko"));
  if(v) u.voice=v;
  if(el){ el.classList.add("playing"); u.onend=u.onerror=()=>el.classList.remove("playing"); }
  speechSynthesis.speak(u);
}

function getHardItems(){
  return DECKS[deckKey].data
    .map(x=>({card:x, rec:rec(x.g)}))
    .filter(x=>x.rec.hard>0)
    .sort((a,b)=>b.rec.hard-a.rec.hard || b.rec.review-a.rec.review || a.card.g.localeCompare(b.card.g));
}

function build(weakOnly=false){
  if(DECKS[deckKey].browse){ queue=[]; cur=null; renderBrowse(); return; }
  const d=DECKS[deckKey].data;
  let pool=weakOnly
    ? d.filter(x=>{ const r=rec(x.g); return r.deferUntil<=round&&(r.hard>0||r.review>0); })
    : d.filter(x=>{ const r=rec(x.g); return r.deferUntil<=round&&r.s<2; });
  queue=[];
  pool.forEach(x=>{
    const r=rec(x.g);
    const n=1+Math.min(r.review,2)+Math.min(r.hard*2,4);
    for(let i=0;i<n;i++) queue.push(x);
  });
  queue.sort(()=>Math.random()-.5);
  next();
}

  </div>`;
  stage.querySelectorAll(".bcell").forEach(el=>{
    el.onclick=()=>play(el.dataset.g, el);
  });
  renderDecks();
}

function stats(){
  const d=DECKS[deckKey].data, tot=d.length;
  const done=d.filter(x=>rec(x.g).s>=2).length;
  sLeft.textContent=new Set(queue.map(x=>x.g)).size;
  sDone.textContent=done+" / "+tot;
  sAcc.textContent=d.filter(x=>{ const r=rec(x.g); return (r.hard>0||r.review>0)&&r.s<2; }).length;
  progBar.style.width=(tot?done/tot*100:0)+"%";
  renderDecks();
  if(!hardBox.classList.contains("hide")) renderHardBox();
}

function next(){
  stats();
  if(!queue.length){ finish(); return; }
  cur=queue[0]; flipped=false;
  const jam=isJamo(cur), words=wordsOf(cur.g), r=rec(cur.g);
  stage.innerHTML=`
    <div class="card" id="card">
      <div class="tag">${cur.t}</div>
      <div class="lvl">${r.hard?`<span style="color:var(--bad)">1 类</span>`:(r.review?`<span style="color:var(--warn)">2 类 ${r.review} 次</span>`:(r.s?`<span style="color:var(--good)">已掌握</span>`:"新卡"))}</div>
      <div id="front">
        <div class="glyph ${jam?"":"say"}" id="g1">${cur.g}</div>
        <div class="word">${wordListHTML(cur.g,words)}</div>
        ${sentenceHTML(cur.g,words)}
      </div>
      <div class="hint">${jam?"点词 / 句子":"点字、词或句子"}可发音　·　点空白处 / 空格键 翻面</div>
    </div>
    <div class="grade hide" id="grade">
      <button id="b0">不会，后面再学 (1)</button><button id="b1">有点会，再出现几次 (2)</button><button id="b2">已掌握 (3)</button>
    </div>`;
  document.getElementById("card").onclick=flip;
  if(!jam){ const g1=document.getElementById("g1"); g1.onclick=e=>{e.stopPropagation();play(cur.g,g1);} }
  bindWordSounds();
}

function flip(){
  if(hasSelection()) return;
  if(flipped||!cur) return; flipped=true;
  const jam=isJamo(cur), words=wordsOf(cur.g);
  document.getElementById("front").outerHTML=`
    <div id="back">
      <div class="glyph ${jam?"":"say"}" id="g2" style="font-size:62px">${cur.g}</div>
      <div class="rom">[ ${cur.r} ]</div>
      <div class="cn">${cur.cn}</div>
      <div class="word">${wordListHTML(cur.g,words)}</div>
      ${sentenceHTML(cur.g,words)}
    </div>`;
  document.querySelector(".hint").textContent=(jam?"点词 / 句子":"点字、词或句子")+"可反复听　·　评分：键盘 1 / 2 / 3";
  document.getElementById("grade").classList.remove("hide");
  if(!jam){ const g2=document.getElementById("g2"); g2.onclick=e=>{e.stopPropagation();play(cur.g,g2);} }
  bindWordSounds();
  b0.onclick=e=>{e.stopPropagation();grade(0)};
  b1.onclick=e=>{e.stopPropagation();grade(1)};
  b2.onclick=e=>{e.stopPropagation();grade(2)};
}

function grade(v){
  if(!flipped||!cur) return;
  const g=cur.g, k=key(deckKey,g), r=rec(g), c=cur;
  queue.shift();
  if(v===2){
    r.s=2;
    r.hard=0;
    r.deferUntil=0;
    queue=queue.filter(x=>x.g!==g);
  }
  else if(v===1){
    r.s=0;
    r.hard=0;
    r.review++;
    r.deferUntil=0;
    queue.splice(Math.min(3,queue.length),0,c);
    queue.splice(Math.min(8,queue.length),0,c);
  }
  else {
    r.s=0;
    r.hard=1;
    r.deferUntil=round+1;
  }
  mem[k]=r; save(); next();
}

function finish(){
  const d=DECKS[deckKey].data;
  const remain=d.filter(x=>rec(x.g).s<2);
  const deferred=remain.filter(x=>rec(x.g).deferUntil>round);
  const hard=d.filter(x=>rec(x.g).hard>0).sort((a,b)=>rec(b.g).hard-rec(a.g).hard).slice(0,24);
  const review=d.filter(x=>rec(x.g).review>0).sort((a,b)=>rec(b.g).review-rec(a.g).review).slice(0,24);
  stage.innerHTML=`<div class="card" style="cursor:default"><div class="done">
    <h2>${remain.length?"这一轮先到这里":"🎉 本组全部掌握"}</h2>
    <div style="color:var(--dim)">${DECKS[deckKey].name} · 共 ${d.length} 个</div>
    ${deferred.length?`<div style="color:var(--dim);margin-top:12px;font-size:13px">有 ${deferred.length} 个 1 类字已顺延到下一轮。点「开始 / 重新洗牌」继续下一轮学习。</div>`:""}
    ${hard.length?`<div style="color:var(--dim);margin-top:18px;font-size:13px">你标成 1 类的字：</div>
      <div class="weak">${hard.map(x=>`<span>${x.g} <small style="color:var(--dim)">${x.r}</small></span>`).join("")}</div>`:""}
    ${review.length?`<div style="color:var(--dim);margin-top:18px;font-size:13px">你标成 2 类的字：</div>
      <div class="weak">${review.map(x=>`<span>${x.g} <small style="color:var(--dim)">${x.r}</small></span>`).join("")}</div>`:""}
  </div></div>`;
  renderDecks();
}

/* ================= 交互 ================= */
document.onkeydown=e=>{
  if(e.code==="Space"){ e.preventDefault(); if(!flipped) flip(); }
  if(e.key==="r"||e.key==="R"){ const w=cur&&wordOf(cur.g); if(cur) play(w?w[0]:cur.g); }
  if(e.key==="1")grade(0); if(e.key==="2")grade(1); if(e.key==="3")grade(2);
};
btnStart.onclick=()=>{ round++; saveRound(); build(); };
btnWeak.onclick=()=>{ if(DECKS[deckKey].browse) return; build(true); };
btnHard.onclick=()=>{
  if(DECKS[deckKey].browse) return;
  hardBox.classList.toggle("hide");
  if(hardBox.classList.contains("hide")){
    btnHard.textContent="查看 1 类清单";
    return;
  }
  btnHard.textContent="收起 1 类清单";
  renderHardBox();
};
btnExport.onclick=()=>{
  exportBox.classList.toggle("hide");
  if(exportBox.classList.contains("hide")){
    btnExport.textContent="导出已掌握";
    return;
  }
  btnExport.textContent="收起已掌握";
  renderExportBox();
};
btnSound.onclick=()=>{ const w=cur&&wordOf(cur.g); if(cur) play(w?w[0]:cur.g); };
btnReset.onclick=()=>{ if(confirm("清空全部学习记录？")){ mem={}; round=1; save(); saveRound(); build(); } };
btnChart.onclick=()=>{
  chart.classList.toggle("hide");
  if(chart.classList.contains("hide")){ btnChart.textContent="查看全表"; return; }
  btnChart.textContent="收起全表";
  let h=`<div style="font-size:13px;color:var(--dim);margin-bottom:8px">完整 19 × 21 = 399 音节表　<span style="color:var(--good)">绿=已掌握</span>　<span style="color:var(--warn)">黄=2 类</span>　<span style="color:var(--bad)">红=1 类</span></div>`;
  h+="<table><tr><th></th>"+JUNG.map((v,i)=>`<th>${v}<br><small>${JUNG_R[i]}</small></th>`).join("")+"</tr>";
  CHO.forEach((c,ci)=>{
    h+=`<tr><th>${c}<br><small>${CHO_R[ci]||"–"}</small></th>`;
    JUNG.forEach((_,vi)=>{ const g=syl(ci,vi);
      const r399=stateOf("t399",g), r140=stateOf("t140",g);
      const r={s:Math.max(r399.s,r140.s), hard:Math.max(r399.hard,r140.hard), review:Math.max(r399.review,r140.review)};
      h+=`<td class="${r.s>=2?'k':(r.hard?'w':(r.review?'m':''))}"><span>${g}</span><small>${(CHO_R[ci]||"")+JUNG_R[vi]}</small></td>`; });
    h+="</tr>";
  });
  chart.innerHTML=h+"</table>";
};
saveRound();
build();
</script>
</body>
</html>
