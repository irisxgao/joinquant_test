<header><div class="wide"><h1>粵語演講點讀稿</h1><p>加長講課版｜逐句播放｜逐段播放｜暫停及繼續</p></div></header>
<div class="toolbar"><div class="wide tools"><button id="pause" class="secondary">⏸ 暫停</button><button id="resume" class="secondary">▶ 繼續</button><button id="stop" class="stop">■ 停止</button><label>語速 <input id="rate" type="range" min="0.55" max="1.2" step="0.05" value="0.78"><b id="rateVal">0.78</b></label><label>聲線 <select id="voice"></select></label><div class="progress"><i id="bar"></i></div><span id="status" class="status">準備播放</span></div></div>
<main class="wide"><div class="notice"><b>操作：</b>每句左邊嘅圓形播放鍵會讀整句；每一部分標題右邊嘅按鈕會由頭讀完整段。播放時可以用頂部按鈕暫停、繼續或者停止。直接點句中詞語，可以單獨讀詞。</div><div id="content"></div></main>
<script>
const data=[["開場：由一個問題開始", ["大家好，今日我想同大家分享一個同粵語有關嘅題目。開始之前，我想問大家一個問題：大家學粵語嘅時候，有冇試過覺得，點解粵語有咁多講法，同普通話或者正式書面語完全唔同？", "例如，我哋會講「一蚊雞」、會講「放飛機」、會講「打尖」，亦會用「擁躉」、「大耳窿」同「傾偈」呢一類詞語。對母語係粵語嘅人嚟講，呢啲講法非常自然；但對初學者嚟講，就可能覺得好奇怪，甚至完全估唔到個意思。", "其實，粵語並唔係故意將啲詞語講到咁複雜。相反，好多口語都係因為當時有實際需要，大家先至慢慢創造出嚟。有人使用，有人明白，個講法就會傳開；用得耐咗，最後就變成日常語言嘅一部分。", "所以今日我唔係淨係想教大家幾個粵語詞語。我更加想借住呢啲例子，同大家睇下語言點樣受到地理、歷史、人口流動、商業活動，同埋民間文化影響。", "今日嘅內容大致分成三部分。第一部分，我會講粵語詞彙點解咁豐富；第二部分，我會講幾個生活化例子；第三部分，我會講學粵語嗰陣，可以點樣由詞語背後嘅故事入手。"]], ["第一個背景：嶺南嘅地理位置", ["首先，我哋由地理講起。大家睇中國地圖就會知道，廣東位於中國南部。以前講到廣東、廣西一帶，成日會用「嶺南」呢個名稱。", "點解叫嶺南呢？其中一個最直接嘅理解，就係呢個地區位於五嶺以南。五嶺未必全部都係非常高嘅山，但喺古代交通唔方便嘅情況之下，山嶺就好似一道天然屏風，令南北之間嘅往來冇今日咁容易。", "地理上有阻隔，語言就有機會喺本地保留一啲比較早期嘅特色，亦有空間獨立發展。當中包括發音、詞彙、句式，同埋一啲古代用法。", "不過，大家千祈唔好以為嶺南係完全封閉。實際上，歷代都有唔同地方嘅人遷入廣東。有人因為戰亂南下，有人因為做生意而來，亦有人因為做官、工作或者家庭原因留低。", "有人來，就自然會帶埋自己嘅語言。新來嘅講法同本地語言接觸之後，可能會保留、改音、改義，亦可能同原有詞語混合。久而久之，粵語入面就累積咗好多唔同時期留下來嘅語言痕跡。", "呢個情況其實唔只粵語先有。世界上好多語言，只要經歷長時間嘅人口流動，都會出現類似現象。但粵語所處嘅地理位置同歷史環境，令呢種混合特別明顯。"]], ["第二個背景：廣州、香港同海外貿易", ["第二個背景，同對外貿易有關。廣州長期都係重要商港，香港開埠之後，亦成為中外商業同文化交流非常頻繁嘅地方。", "當本地人接觸新商品、新制度、新技術同新生活方式，就一定要諗辦法幫佢哋改名。如果原有語言有合適詞語，就可以直接用；如果冇，就要借音、借義，或者創造一個新講法。", "大家可以想像一下，假如一件外國商品第一次運到廣州，普通市民唔知道佢正式叫咩名，外文名稱又可能太長、太難讀。最實際嘅做法，就係用一個容易講、容易記，而且大家一聽就明嘅名稱。", "呢種命名方式未必符合正式書面語，但對市場交易非常有效。商人講一次，顧客就明；顧客返去再同屋企人講，個詞就慢慢流傳開去。", "因此，粵語有唔少外來詞，亦有好多將外來事物本地化嘅名稱。佢哋反映嘅唔單止係語言變化，仲反映咗廣東人點樣理解新事物，同埋點樣將陌生事物變成日常生活嘅一部分。", "換句話講，粵語詞彙之所以豐富，其中一個重要原因，就係佢長期處於一個需要快速溝通、快速命名、快速適應嘅商業環境。"]], ["第三個背景：行業術語同民間文化", ["第三個背景，係行業術語同民間文化。以前唔同工種都有自己嘅專門講法，例如木工、碼頭工人、商販、戲班、警察，或者其他社群，都可能有圈內先聽得明嘅術語。", "有啲講法本來係方便同行溝通；有啲可能帶少少暗語性質，唔想圈外人即刻聽明；亦有啲只係某個地方或者某一代人慣用。", "後來，呢啲詞語可能透過街市、茶樓、報紙、粵劇、電台、電影同電視劇流入大眾生活。當越來越多人聽過，而且知道點樣使用，原本嘅行業術語就會變成普通口語。", "呢度亦要提醒大家，研究俗語來源嗰陣，要分清楚「有文獻記錄嘅解釋」同「民間流傳嘅故事」。有啲故事非常精彩，而且好容易記，但未必有足夠證據證明係唯一來源。", "所以今日講到詞源，我會盡量用「其中一種說法」、「常見解釋」或者「民間流傳」呢啲表達。咁樣既可以保留故事嘅趣味，亦唔會將未完全考證嘅內容講成絕對事實。"]], ["例子一：一蚊雞", ["講完三個背景，我哋進入第一個例子。大家有冇聽過「一蚊雞」？如果有人問你「呢樣嘢幾錢呀」，你答「一蚊雞」，意思就係一蚊，亦即係一元。", "「一」係數量，大家好容易理解；「蚊」就係粵語對貨幣單位「元」嘅常用講法。最令人好奇嘅，通常係最後嗰個「雞」字。點解一蚊會同雞有關呢？", "其中一個廣為流傳嘅解釋，同以前喺中國沿海流通嘅墨西哥銀圓有關。清代對外貿易需要大量白銀，但如果使用碎銀，每次交易都要稱重量、驗成色，非常麻煩。", "銀圓就方便好多。因為銀圓有相對固定嘅大小、重量同圖案，商人容易辨認，交易嗰陣亦容易計算。墨西哥銀圓喺華南曾經相當常見。", "呢類銀圓上面有鷹嘅圖案。民間故事話，一啲未見過鷹、或者對鷹唔熟悉嘅廣東人，見到銀圓上面有一隻有翼嘅雀，就用自己最熟悉嘅「雞」去稱呼佢。", "於是，一個帶住「雞」圖案印象嘅銀圓，就可能被叫成「一蚊雞」。呢個解釋非常形象，亦同當時華南嘅海外貿易背景配合。", "不過，「一蚊雞」亦有其他詞源說法。有人從舊貨幣名稱或者昔日香港社會生活去解釋個「雞」字。現有資料未必足以排除所有其他可能，所以演講時最好講成其中一種流行說法。", "今日香港人仲會講「一蚊雞」、「兩蚊雞」或者「三蚊雞」。但當金額大一啲，好似十蚊、三百蚊，通常就唔會再加「雞」字。", "呢個例子好好咁反映咗粵語命名嘅特色。陌生嘅外來貨幣，經過一個大家熟悉、容易理解嘅形象重新命名，就可以迅速進入大眾口語。", "如果我要用一句話總結呢個例子，我會話：語言最重要嘅功能係溝通，而一個容易記、容易講、大家都聽得明嘅名稱，往往比正式名稱傳得更快。"]], ["例子二：放飛機", ["第二個例子係「放飛機」。如果朋友應承咗同你食飯，但到最後完全冇出現，你就可以話：「佢今日放咗我飛機。」", "「放飛機」即係失約、甩底，英文可以講 stand someone up。呢句說話喺香港日常生活、電影同電視劇入面都好常見。", "其中一個廣為流傳嘅詞源故事，同一九一一年香港一場早期飛行表演有關。嗰個年代，動力飛機仍然係非常新奇嘅科技，普通市民未必親眼見過飛機升空。", "當時有人帶飛機到香港表演，亦有觀眾畀錢入場。大家滿心期待，希望見到飛機真正飛上天空。對當時嘅人嚟講，呢個就好似今日第一次睇太空科技表演一樣震撼。", "但早期飛機對天氣、場地同機件狀況要求好高。表演受到風勢或者機件問題影響，有啲日子未能順利起飛。觀眾畀咗錢，最後可能只係見到一部飛機擺喺空地。", "大家可以想像嗰種失望。明明有人應承畀你睇飛機飛，最後只係「放咗一部飛機喺度」，但冇完成大家期待嘅事情。", "按照呢個流傳故事，「放飛機」後來就由一次具體嘅飛行表演經驗，慢慢演變成應承咗人但冇出現、冇履行承諾嘅意思。", "呢個故事有唔同細節版本，例如表演日數、未能起飛嘅原因，同埋俗語確實形成嘅過程，資料未必完全一致。因此，最穩妥嘅講法係：香港有一個流傳甚廣嘅說法，將「放飛機」同早期飛行表演聯繫起來。", "呢個例子亦顯示，語言好鍾意用具體畫面表達抽象感受。失約本身係一個抽象概念，但「畀咗錢、去到現場、最後只見到部飛機」就係一幅人人都可以想像到嘅畫面。", "所以下次有人放你飛機，你除咗嬲之外，亦可以諗起呢句俗語背後嗰個充滿科技感同失望感嘅歷史故事。"]], ["例子三：趸、擁躉、打躉", ["第三個例子係「趸」字。呢個字唔係每個學粵語嘅人都識寫，但好多香港人其實成日講。粵拼讀作 dan2。", "「趸」可以令人聯想到大量、整批，亦可以有固定喺某個地方、長時間停留嘅意思。由呢啲基本概念，粵語再發展出幾組好實用嘅詞。", "第一個係「躉貨」。做生意嗰陣，如果大量入貨，或者將貨物囤積起來，就可以用「躉貨」去形容。呢個用法保留咗大量、整批嘅意思。", "第二個係「擁躉」。如果一個人長期支持某位歌手、某隊球隊、某個品牌或者某個團體，就可以叫佢做擁躉。", "今日我哋亦會用「粉絲」呢個詞，但「擁躉」通常帶有長期、忠實支持嘅感覺。你可以話：「佢係呢隊波嘅忠實擁躉。」", "第三個係「打躉」。以前有人冇乜嘢做，長時間坐喺茶樓、鋪頭或者某個地方，我哋可以話佢「喺度打躉」。", "「躉低」亦係一個口語用法，可以解作放低、留低。例如有人叫你將一份文件留喺辦公室，可以話：「你躉低份文件喺度啦。」", "由「大量」到「長期留喺某個地方」，再到「長期支持某個人」，呢一組詞義其實有一條幾清楚嘅延伸路線。", "呢個例子重要嘅地方，係佢提醒我哋：粵語唔係全部詞都來自外語。有好多詞係由漢字原有意思，經過長時間口語使用，再慢慢發展出新含義。", "所以當大家學到一個陌生粵語字，唔好淨係死記一個中文翻譯。試下了解佢最基本嘅概念，再睇其他組合詞，通常會更加容易記。"]], ["例子四：大耳窿同香港放債法例", ["第四個例子係「大耳窿」。粵語入面，「大耳窿」通常指放貴利嘅人，有時亦可以泛指高息貸款。", "點解放高利貸嘅人會叫「大耳窿」呢？民間有一個常見故事，話香港開埠初期，有一啲南亞裔人士從事借貸生意，部分人會戴住比較明顯嘅大耳環。", "因為嗰個外形特徵容易辨認，市民據說就用「大耳窿」去稱呼佢哋。亦有人將個「窿」字同英文 loan 聯想起來，認為當中可能有借音成分。", "呢啲講法相當流行，但文獻證據未必足以證明某一個版本就係唯一來源。因此，介紹呢個詞嗰陣，最好清楚講明佢係民間詞源故事。", "講到高息貸款，原回放有一個數字需要更新同修正。香港由二零二二年十二月三十日起，法定貸款實際年利率上限由百分之六十下調至百分之四十八。", "另外，實際年利率超過百分之三十六，會被推定為敲詐性利率，法庭可以因應情況重新商議交易。", "所以原本講「高過百分之四十就係犯法」並唔準確。正式演講如果提到法律數字，最好講清楚係百分之四十八上限，同埋百分之三十六敲詐性利率門檻。", "當然，呢度唔係法律課。我哋最主要係透過「大耳窿」呢個詞，睇到香港早期移民社會、商業活動，同民間命名方式之間嘅關係。", "一個口語稱呼，可能同外形、職業、外語聲音同社會印象同時有關。呢種多重來源，正正係俗語研究最有趣、亦最需要謹慎嘅地方。"]], ["例子五：打尖點解係插隊", ["第五個例子係「打尖」。喺今日粵語入面，「打尖」通常解作插隊，即係唔按照次序排隊，攝入其他人前面或者隊伍中間。", "不過，如果大家閱讀一啲比較舊嘅北方文學作品，可能會見到另一種「打尖」。嗰種用法可以指旅途中停低歇腳、飲茶或者食飯，意思同粵語插隊並唔一樣。", "粵語「打尖」有一個非常形象嘅常見解釋，同以前木工修補家具嘅方法有關。傳統木製家具好多時用榫卯接合，未必需要大量鐵釘。", "家具用得耐咗，接合位置可能會鬆，木件之間就會出現罅隙。工匠修補嗰陣，可以將一塊細小、尖形嘅木楔放入空隙，再用工具將佢打入去。", "「尖」可以理解為細小木楔，「打」就係將佢敲入罅隙。於是，呢個修補動作就形成一幅「將一件細小嘅嘢攝入空位」嘅畫面。", "後來有人將排隊插入空隙嘅行為，比喻成將木尖打入家具罅隙，所以「打尖」就有插隊嘅意思。", "例如你喺餐廳排隊，有人突然行到最前面，你可以話：「唔該排隊呀，唔好打尖。」呢句係非常自然嘅香港粵語。", "呢個詞源解釋好容易記，因為動作同畫面非常清楚。不過，同其他俗語一樣，如果未有充分文獻考證，最好稱為常見解釋，而唔係唯一確定答案。", "從學語言角度睇，將抽象意思連接一幅實際畫面，記憶會深好多。你一諗到將木尖打入罅隙，就會自然記得「打尖」即係攝入隊伍。"]], ["其他詞語：線人、傾偈、揸 fit 人", ["除咗頭先幾個例子，粵語仲有好多值得講嘅詞。第一個係「線人」。線人通常指向警方、傳媒或者某個組織提供消息嘅人。", "「線」可以令人聯想到消息線索。線人未必公開身份，佢嘅作用係將內部消息或者有用線索傳畀另一方。港產警匪片入面成日會聽到呢個詞。", "第二個係「傾偈」。傾偈即係聊天、談話。例如「得閒一齊傾偈」，意思就係有時間一齊聊聊天。", "有人可能會問，「偈」字點解會同聊天有關？呢個字本來可以見於佛教語境，例如偈語、偈頌。至於「傾偈」點樣固定成聊天嘅意思，亦有唔同解釋。學習時最重要係知道現代口語用法。", "「傾偈」通常係中性而友善嘅講法。如果你話一個人「講嘢講極都唔完」，語氣就可能帶少少嫌佢長氣；但「我哋坐低傾下偈」通常聽落輕鬆親切。", "第三個係「揸 fit 人」。呢個詞通常指負責人、話事人，亦即係一個地方或者一件事由邊個作主。", "「揸」喺粵語有握住、控制、掌握嘅意思。「fit」嘅具體來源有唔同說法，亦可能同特定群體嘅暗語或者外語轉化有關。", "日常可以問：「呢度邊個係揸 fit 人？」意思即係邊個負責、邊個可以作決定。呢個講法比較口語，正式場合通常會講負責人或者主管。", "透過呢三個例子，大家可以見到粵語詞彙有唔同層次。有啲來自本地生活，有啲同宗教或者傳統文字有關，有啲就可能混合外語同圈內用語。"]], ["歇後語同粵語幽默", ["粵語文化仲有一類好得意嘅語言形式，就係歇後語。歇後語通常分成前後兩部分，前半句講一個畫面或者故事，後半句就係真正意思。", "如果講者同聽者都熟悉個典故，有時講前半句已經夠，後半句可以唔講。正因為大家共享同一套文化記憶，聽者先可以即刻接到個意思。", "例如，有啲歇後語會利用同音字。畫面本身可能好誇張，真正答案就靠粵語讀音轉出另一個意思。", "原回放提到「火燒旗杆」一類說法。旗杆又長又直，燒過之後會變黑，於是透過形象同同音，形成另一層幽默意思。", "歇後語最有趣嘅地方，唔單止係答案，而係講者同聽者之間嗰種默契。你一講上半句，對方已經笑，代表大家對個語言文化有共同理解。", "對粵語初學者嚟講，歇後語可能比較難，因為要同時理解字面、讀音、背景同真正意思。但亦正因為咁，學識一兩句之後會非常有成功感。", "我建議大家唔使一次過背好多。揀幾句自己覺得有畫面、容易記嘅，了解佢嘅用法，再喺合適場合聽下本地人點樣講。"]], ["點樣用影視同日常材料學粵語", ["講到最後，我想分享幾個學粵語嘅方法。第一，唔好淨係背單字，要連埋整句一齊學。因為粵語好多語氣同節奏，要放入句子先容易掌握。", "例如，唔好淨係背「放飛機」三個字。你可以學完整一句：「你聽日唔好放我飛機呀。」咁樣你會同時學到語序、語氣同實際使用場合。", "第二，可以睇粵語電影、電視劇、新聞或者生活影片。初學嗰陣最好有字幕，先聽一次，再對字幕，最後跟住角色講一次。", "第三，將播放速度調慢。聽得唔明唔一定係詞彙不足，亦可能係母語人士連讀太快。將速度降到零點八倍，逐句重聽，通常會清楚好多。", "第四，記錄自己真係會用嘅句子。如果你每日返工，就優先學辦公室用語；如果你鍾意睇戲，就先學影視對白。語言同生活有關，先會容易保留。", "第五，唔好怕自己口音唔標準。開始嗰陣，最重要係畀人聽得明。之後再慢慢改善聲調、懶音、連讀同語氣。", "最後，可以利用今日呢個點讀頁面。每一句前面都有播放鍵，可以重複聽整句；每一部分亦可以由頭播放。聽一句，停一停，自己跟讀，再播放原句比較，效果會比淨係閱讀好。"]], ["總結：語言就係一部生活史", ["今日我哋由三個背景出發，了解粵語詞彙點解咁豐富。第一係嶺南嘅地理同人口流動；第二係廣州、香港同海外貿易；第三係行業術語同民間文化。", "之後，我哋講咗「一蚊雞」、「放飛機」、「趸」、「大耳窿」、「打尖」、「線人」、「傾偈」同「揸 fit 人」。", "有啲詞同外來商品有關，有啲同本地歷史故事有關，有啲由漢字原來意思慢慢延伸，亦有啲可能來自某個行業或者社群。", "最重要嘅係，語言唔係一件放喺博物館、永遠唔會改變嘅展品。只要有人使用，語言就會借詞、創造、縮短、轉義，亦會將一代人嘅生活經驗傳畀下一代。", "因此，學粵語唔單止係學九個聲調、學幾多個生字，亦係了解嶺南人點樣生活、點樣做生意、點樣開玩笑，同埋點樣理解外面嘅世界。", "當大家下次再聽到一個奇怪但有趣嘅粵語詞，不妨問三個問題：呢個詞原本可能來自邊度？佢描寫咗一幅咩畫面？點解當時嘅人需要創造呢個講法？", "只要沿住呢三個問題去探索，你會發現，每一個詞背後都可能藏住一段生活史。", "多謝大家今日聽我分享。希望大家聽完之後，唔單止記得幾個詞語，亦會對粵語背後嘅歷史同文化多一分興趣。", "如果大家有問題，或者有其他粵語詞想了解，我哋可以一齊傾下偈。多謝大家。"]]]; const synth=window.speechSynthesis; let rows=[], activeQueue=[], queuePos=0, stopped=true, paused=false, playToken=0;
const content=document.querySelector('#content'), statusEl=document.querySelector('#status'), bar=document.querySelector('#bar'), voiceSel=document.querySelector('#voice');
function tokenize(el,text){let seg;try{seg=[...new Intl.Segmenter('zh-HK',{granularity:'word'}).segment(text)]}catch(e){seg=[...text].map(x=>({segment:x,isWordLike:/[\p{L}\p{N}]/u.test(x)}))}seg.forEach(x=>{if(x.isWordLike){const s=document.createElement('span');s.className='word';s.textContent=x.segment;s.title='點擊讀詞';s.onclick=e=>{e.stopPropagation();startQueue([{text:x.segment,row:null}])};el.appendChild(s)}else el.append(x.segment)})}
data.forEach(([title,sents],si)=>{const sec=document.createElement('section');sec.className='section';const head=document.createElement('div');head.className='section-head';const h=document.createElement('h2');h.textContent=title;const pb=document.createElement('button');pb.className='section-play';pb.textContent='▶ 播放完整部分';head.append(h,pb);sec.appendChild(head);const local=[];sents.forEach((text,ii)=>{const row=document.createElement('div');row.className='sentence-row';const btn=document.createElement('button');btn.className='play-one';btn.textContent='▶';btn.title='播放整句';const sentence=document.createElement('div');sentence.className='sentence';tokenize(sentence,text);row.append(btn,sentence);sec.appendChild(row);const item={text,row,section:si,index:ii};rows.push(item);local.push(item);btn.onclick=e=>{e.stopPropagation();startQueue([item])};sentence.onclick=()=>startQueue([item])});pb.onclick=()=>startQueue(local);content.appendChild(sec)});
function loadVoices(){const vs=synth.getVoices();voiceSel.innerHTML='';vs.sort((a,b)=>Number(!/zh-HK|yue/i.test(a.lang))-Number(!/zh-HK|yue/i.test(b.lang))).forEach((v,i)=>{const o=new Option(`${v.name} (${v.lang})`,v.voiceURI);voiceSel.add(o)})}loadVoices();synth.onvoiceschanged=loadVoices;
function clearActive(){rows.forEach(x=>x.row.classList.remove('active'))}
function chosenVoice(){const vs=synth.getVoices();return vs.find(v=>v.voiceURI===voiceSel.value)||vs.find(v=>/zh-HK|yue/i.test(v.lang))}
function startQueue(items){playToken++;synth.cancel();activeQueue=items;queuePos=0;stopped=false;paused=false;setTimeout(()=>playNext(playToken),60)}
function playNext(token){if(token!==playToken||stopped)return;if(queuePos>=activeQueue.length){finish();return}const item=activeQueue[queuePos];clearActive();if(item.row){item.row.classList.add('active');item.row.scrollIntoView({behavior:'smooth',block:'center'})}const u=new SpeechSynthesisUtterance(item.text);const v=chosenVoice();if(v)u.voice=v;u.lang='zh-HK';u.rate=+document.querySelector('#rate').value;u.pitch=1;statusEl.textContent=`播放中 ${queuePos+1} / ${activeQueue.length}`;bar.style.width=`${((queuePos+1)/activeQueue.length)*100}%`;u.onend=()=>{if(token!==playToken||stopped)return;queuePos++;playNext(token)};u.onerror=e=>{if(e.error!=='canceled'){queuePos++;playNext(token)}};synth.speak(u)}
function finish(){stopped=true;paused=false;clearActive();statusEl.textContent='播放完成';bar.style.width='100%'}
document.querySelector('#pause').onclick=()=>{if(synth.speaking&&!synth.paused){synth.pause();paused=true;statusEl.textContent='已暫停'}};
document.querySelector('#resume').onclick=()=>{if(synth.paused){synth.resume();paused=false;statusEl.textContent=`繼續播放 ${queuePos+1} / ${activeQueue.length}`}};
document.querySelector('#stop').onclick=()=>{playToken++;stopped=true;paused=false;synth.cancel();clearActive();statusEl.textContent='已停止';bar.style.width='0%'};
document.querySelector('#rate').oninput=e=>document.querySelector('#rateVal').textContent=e.target.value;
</script></body></html>
