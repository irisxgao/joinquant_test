<body>
<main>
  <h1>粤语逐字点读</h1>
  <p class="tip">点击单个字可逐字发音，点击播放按钮可读出整句或整段。粤语和英语段落分别使用对应的系统声音。</p>
  <section class="toolbar" aria-label="播放设置">
    <label>粤语声音<select id="cantoneseVoice"></select></label>
    <label>英语声音<select id="englishVoice"></select></label>
    <label>语速 <input id="rate" type="range" min="0.5" max="1.4" step="0.1" value="0.85"><span id="rateValue">0.8</span></label>
    <button id="stop" type="button">停止</button>
  </section>
  <div class="layout">
    <nav id="toc" class="sidebar" aria-label="目录"></nav>
    <div id="app" class="content"></div>
  </div>
  <footer>说明：发音由浏览器和操作系统提供。若没有粤语声音，请在系统语言或语音设置中安装“粤语／中文（香港）”语音。</footer>
</main>

const synth = window.speechSynthesis;
const app = document.querySelector('#app');
const toc = document.querySelector('#toc');
const cantoneseVoiceSelect = document.querySelector('#cantoneseVoice');
const englishVoiceSelect = document.querySelector('#englishVoice');
const rate = document.querySelector('#rate');
const rateValue = document.querySelector('#rateValue');
let voices = [];
let activeLoop = null;

function loadVoices(){
  voices = synth.getVoices();
  fillVoiceSelect(cantoneseVoiceSelect, voices.filter(v => /^(yue|zh-HK)/i.test(v.lang) || /cantonese|hong kong|粵|粤|廣東|广东/i.test(v.name)), '粤语声音');
  fillVoiceSelect(englishVoiceSelect, voices.filter(v => /^en/i.test(v.lang)), '英语声音');
}

function fillVoiceSelect(select, matches, label){
  const list = matches.length ? matches : voices;
  select.innerHTML = '';
  list.forEach(v=>{ const o=document.createElement('option'); o.value=voices.indexOf(v); o.textContent=`${v.name} (${v.lang})`; select.appendChild(o); });
  if(!list.length){ const o=document.createElement('option'); o.textContent=`使用系统默认${label}`; o.value=''; select.appendChild(o); }
}
loadVoices();
if ('onvoiceschanged' in synth) synth.onvoiceschanged = loadVoices;

rate.addEventListener('input',()=>rateValue.textContent=Number(rate.value).toFixed(1));
document.querySelector('#stop').addEventListener('click', stopPlayback);

function stopPlayback(){
  synth.cancel();
  if(activeLoop?.button) activeLoop.button.textContent = activeLoop.defaultLabel;
  activeLoop = null;
  document.querySelectorAll('.speaking').forEach(x=>x.classList.remove('speaking'));
}

function speak(text, element, lang='yue-HK', onend=null, fromLoop=false){
  if(!fromLoop && activeLoop?.button){
    activeLoop.button.textContent = activeLoop.defaultLabel;
    activeLoop = null;
  }
  synth.cancel();
  document.querySelectorAll('.speaking').forEach(x=>x.classList.remove('speaking'));
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = Number(rate.value);
  const select = lang.startsWith('en') ? englishVoiceSelect : cantoneseVoiceSelect;
  const selected = voices[Number(select.value)];
  if(selected) u.voice = selected;
  if(element) element.classList.add('speaking');
  u.onend=()=>{ if(element) element.classList.remove('speaking'); if(onend) onend(); };
  u.onerror=()=>{ if(element) element.classList.remove('speaking'); if(activeLoop) stopPlayback(); };
  synth.speak(u);
}

function toggleTopicLoop(topic, button){
  if(activeLoop?.button === button){
    stopPlayback();
    return;
  }
  stopPlayback();
  if(!topic.paragraphs.length) return;
  activeLoop = { topic, button, index: 0, paragraphs: topic.paragraphs, lang: topic.lang, defaultLabel: topic.defaultLabel };
  button.textContent = '停止循环播放';
  playNextTopicParagraph();
}

function playNextTopicParagraph(){
  if(!activeLoop) return;
  const paragraph = activeLoop.paragraphs[activeLoop.index];
  const spoken = activeLoop.lang.startsWith('en') ? paragraph : parseLine(paragraph).map(x=>x.char).join('');
  speak(spoken, null, activeLoop.lang, ()=>{
    if(!activeLoop) return;
    activeLoop.index = (activeLoop.index + 1) % activeLoop.paragraphs.length;
    playNextTopicParagraph();
  }, true);
}

function parseLine(line){
  const items=[];
  const re=/([^\s()])(?:\(([^()]+)\))?/gu;
  let m;
  while((m=re.exec(line))!==null) items.push({char:m[1], jyut:m[2]||''});
  return items;
}

function parseEnglishParagraph(text){
  const items=[];
  const re=/([A-Za-z]+(?:['-][A-Za-z]+)*)|([^A-Za-z\s]+)|(\s+)/g;
  let m;
  while((m=re.exec(text))!==null){
    if(m[1]) items.push({type:'word', value:m[1]});
    else if(m[2]) items.push({type:'punct', value:m[2]});
    else if(m[3]) items.push({type:'space', value:m[3]});
  }
  return items;
}

function slugify(value){
  return value.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, '-').replace(/^-+|-+$/g, '') || 'topic';
}

function renderToc(){
  toc.innerHTML='';
  const title=document.createElement('h2');
  title.className='toc-title';
  title.textContent='目录';
  const list=document.createElement('div');
  list.className='toc-list';
  const practiceLink=document.createElement('a');
  practiceLink.className='toc-link';
  practiceLink.href='#practice';
  practiceLink.textContent='练习短句';
  list.appendChild(practiceLink);
  TOPICS.forEach((topic,index)=>{
    const link=document.createElement('a');
    link.className='toc-link';
    link.href=`#topic-${index+1}-${slugify(topic.title)}`;
    link.textContent=`Topic ${index+1}：${topic.title}`;
    list.appendChild(link);
  });
  toc.append(title,list);
}

function render(){
  app.innerHTML='';
  renderToc();
  const lines=CONTENT.map(x=>x.trim()).filter(Boolean);
  if(lines.length){
    const practiceSection=document.createElement('section');
    practiceSection.className='topic';
    practiceSection.id='practice';
    const practiceTitle=document.createElement('h2');
    practiceTitle.className='topic-title';
    practiceTitle.textContent='练习短句';
    practiceSection.appendChild(practiceTitle);
    lines.forEach((line,index)=>{
      const items=parseLine(line);
      const spoken=items.map(x=>x.char).join('');
      const row=document.createElement('section'); row.className='sentence';
      const play=document.createElement('button'); play.className='play'; play.type='button'; play.textContent='▶'; play.title=`播放第 ${index+1} 句`; play.setAttribute('aria-label',play.title); play.onclick=()=>speak(spoken,play);
      const tokens=document.createElement('div'); tokens.className='tokens';
      items.forEach(item=>{
        if(item.jyut){
          const b=document.createElement('button'); b.type='button'; b.className='token'; b.title=`${item.char} ${item.jyut}`;
          const han=document.createElement('span'); han.className='han'; han.textContent=item.char;
          const jyut=document.createElement('span'); jyut.className='jyut'; jyut.textContent=item.jyut;
          b.append(han,jyut); b.onclick=()=>speak(item.char,b); tokens.appendChild(b);
        }else{
          const s=document.createElement('span'); s.className='punct'; s.textContent=item.char; tokens.appendChild(s);
        }
      });
      row.append(play,tokens); practiceSection.appendChild(row);
    });
    app.appendChild(practiceSection);
  } else {
    app.innerHTML='<div class="error">CONTENT 里还没有内容。</div>';
  }
  TOPICS.forEach((topic,index)=>renderTopic(topic,index));
}

function renderTopic(topic,index){
  const section=document.createElement('section'); section.className='topic';
  section.id = `topic-${index+1}-${slugify(topic.title)}`;
  const header=document.createElement('div'); header.className='topic-header';
  const title=document.createElement('h2'); title.className='topic-title'; title.textContent=`Topic ${index+1}：${topic.title}`;
  const actions=document.createElement('div'); actions.className='topic-actions';
  const cantoneseLoopButton=document.createElement('button'); cantoneseLoopButton.className='loop-topic'; cantoneseLoopButton.type='button'; cantoneseLoopButton.textContent='循环播放本 topic 粤语'; cantoneseLoopButton.onclick=()=>toggleTopicLoop({ paragraphs: topic.cantoneseParagraphs, lang: 'yue-HK', defaultLabel: '循环播放本 topic 粤语' }, cantoneseLoopButton);
  const englishLoopButton=document.createElement('button'); englishLoopButton.className='loop-topic'; englishLoopButton.type='button'; englishLoopButton.textContent='循环播放本 topic 英语'; englishLoopButton.onclick=()=>toggleTopicLoop({ paragraphs: topic.englishParagraphs, lang: 'en-US', defaultLabel: '循环播放本 topic 英语' }, englishLoopButton);
  actions.append(cantoneseLoopButton, englishLoopButton);
  header.append(title,actions);
  section.appendChild(header);
  const cantoneseTitle = document.createElement('h2'); cantoneseTitle.textContent='粤语文章（按段播放）';
  section.appendChild(cantoneseTitle);
  topic.cantoneseParagraphs.forEach((paragraph,paragraphIndex)=>renderCantoneseParagraph(section, paragraph, paragraphIndex));
  const englishTitle = document.createElement('h2'); englishTitle.textContent='American Native English Version（按段播放）';
  section.appendChild(englishTitle);
  topic.englishParagraphs.forEach((paragraph,paragraphIndex)=>renderEnglishParagraph(section, paragraph, paragraphIndex));
  app.appendChild(section);
}

function renderCantoneseParagraph(container, paragraph,index){
  const row=document.createElement('section'); row.className='paragraph';
  const play=document.createElement('button'); play.className='play'; play.type='button'; play.textContent='▶'; play.title=`播放粤语第 ${index+1} 段`; play.setAttribute('aria-label',play.title);
  const items=parseLine(paragraph); const spoken=items.map(x=>x.char).join(''); play.onclick=()=>speak(spoken,play,'yue-HK');
  const tokens=document.createElement('div'); tokens.className='tokens paragraph-text';
  items.forEach(item=>{ if(item.jyut){ const b=document.createElement('button'); b.type='button'; b.className='token'; b.title=`${item.char} ${item.jyut}`; const han=document.createElement('span'); han.className='han'; han.textContent=item.char; const jyut=document.createElement('span'); jyut.className='jyut'; jyut.textContent=item.jyut; b.append(han,jyut); b.onclick=()=>speak(item.char,b,'yue-HK'); tokens.appendChild(b); } else { const s=document.createElement('span'); s.className='punct'; s.textContent=item.char; tokens.appendChild(s); } });
  row.append(play,tokens); container.appendChild(row);
}

function renderEnglishParagraph(container, paragraph,index){
  const row=document.createElement('section'); row.className='paragraph';
  const play=document.createElement('button'); play.className='play'; play.type='button'; play.textContent='▶'; play.title=`Play English paragraph ${index+1}`; play.setAttribute('aria-label',play.title); play.onclick=()=>speak(paragraph,play,'en-US');
  const tokens=document.createElement('div'); tokens.className='tokens english-text';
  parseEnglishParagraph(paragraph).forEach(item=>{
    if(item.type === 'word'){
      const b=document.createElement('button');
      b.type='button';
      b.className='token english-token';
      b.textContent=item.value;
      b.title=`${item.value}`;
      b.onclick=()=>speak(item.value,b,'en-US');
      tokens.appendChild(b);
    }else{
      const span=document.createElement('span');
      span.className='punct';
      span.style.fontSize='15px';
      span.textContent=item.value;
      tokens.appendChild(span);
    }
  });
  row.append(play,tokens); container.appendChild(row);
}
render();
</script>
</body>
